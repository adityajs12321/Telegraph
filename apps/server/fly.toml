# fly.io build commands:
#   fly launch --no-deploy --copy-config --config apps/server/fly.toml
#   fly secrets set DATABASE_URL=postgres://... --config apps/server/fly.toml
#   fly deploy . --config apps/server/fly.toml --dockerfile apps/server/Dockerfile
app = "telegraph-server"
primary_region = "bom"
swap_size_mb = 512

[env]
  PORT = "8080"
  MESSAGE_TTL_HOURS = "24"

[http_service]
  internal_port = 8080
  force_https = true
  auto_stop_machines = "off"
  auto_start_machines = true
  min_machines_running = 1

  [[http_service.checks]]
    method = "GET"
    path = "/health"
    interval = "30s"
    timeout = "5s"
    grace_period = "10s"

[[vm]]
  size = "shared-cpu-1x"
  memory = "256mb"
